name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devops-container-app:${{ github.sha }} .

      - name: Check Docker Image
        run: docker images devops-container-app


  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test, docker]

    steps:

      - name: Deployment Status
        run: |
          echo "=================================="
          echo "CI/CD PIPELINE COMPLETED"
          echo "=================================="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Status: SUCCESS"
          echo "Docker Image: devops-container-app:${{ github.sha }}"
